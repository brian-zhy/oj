# Jason227 OJ —— 前端 nginx 配置（容器内）
# 架构：nginx 托管 Vue 构建产物，并将 API 请求反代到后端容器 oj-service:8000

server {
    listen 80;
    server_name _;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 静态资源缓存（Vite 产物带内容哈希，可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 通用代理头
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_read_timeout 60s;

    # ===== API 反代 =====
    # 管理后台等带 /api 前缀的请求：去掉 /api 转发（后端挂载在 /admin、/judgement 等）
    location /api/ {
        proxy_pass http://oj-service:8000/;
    }

    # 不带 /api 前缀的接口（登录/用户/犇犇/令牌）
    # 注意：不要代理 /judgement、/submissions —— 它们同时是前端路由
    location /auth/ {
        proxy_pass http://oj-service:8000;
    }

    location /users/ {
        proxy_pass http://oj-service:8000;
    }

    # 犇犇接口的请求路径为 /benben（无尾斜杠），location 不能带尾斜杠，
    # 否则不匹配并落入 SPA 回退导致发布失败
    location /benben {
        proxy_pass http://oj-service:8000;
    }

    location /tokens/ {
        proxy_pass http://oj-service:8000;
    }

    # 文件上传体积限制
    client_max_body_size 20m;

    # SPA history 路由回退：所有未匹配路径交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
