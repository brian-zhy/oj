# Jason227 OJ —— 前端 nginx 配置（容器内）
# 架构：nginx 托管 Vue 构建产物，并将 API 请求反代到后端容器 oj-service:8000

# 客户端真实 IP：外层宝塔 nginx 以覆盖式 proxy_set_header X-Real-IP $remote_addr
# 注入真实客户端 IP（客户端伪造的同名头会被覆盖），这里透传给后端做按 IP 限量。
# 若直连本容器（本地调试，无宝塔层），回退用对端地址。
map $http_x_real_ip $oj_client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

server {
    # 纯 HTTP 监听：HTTPS 由外层宝塔 nginx（443，域名证书）统一终结后
    # 以 HTTP 反代到本容器（宿主 8888 -> 容器 80）。容器内不再做 SSL。
    listen 80;
    server_name _;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 静态资源缓存（Vite 产物带内容哈希，可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 通用代理头
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # 透传宝塔注入的真实客户端 IP（不可用 $remote_addr 覆盖——那只是宝塔宿主地址）
    proxy_set_header X-Real-IP $oj_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_read_timeout 60s;

    # ===== API 反代 =====
    # 管理后台等带 /api 前缀的请求：去掉 /api 转发（后端挂载在 /admin、/judgement 等）
    location /api/ {
        proxy_pass http://oj-service:8000/;
    }

    # 不带 /api 前缀的接口（登录/用户/犇犇/令牌）
    # 注意：不要代理 /judgement、/submissions —— 它们同时是前端路由
    location /auth/ {
        proxy_pass http://oj-service:8000;
        add_header Cache-Control "no-store";
    }

    location /users/ {
        proxy_pass http://oj-service:8000;
        add_header Cache-Control "no-store";
    }

    # 犇犇接口的请求路径为 /benben（无尾斜杠），location 不能带尾斜杠，
    # 否则不匹配并落�� SPA 回退导致发布失败
    location /benben {
        proxy_pass http://oj-service:8000;
        add_header Cache-Control "no-store";
    }

    # 上传的静态文件（头像等）
    location /static/ {
        proxy_pass http://oj-service:8000;
        expires 7d;
    }

    location /tokens/ {
        proxy_pass http://oj-service:8000;
        add_header Cache-Control "no-store";
    }

    # 文件上传体积限制：批量导入测试点 ZIP 需要足够空间
    # 后端 API 自己限制在 50MB，因此这里放宽到 55MB，避免容器内 Nginx 先拦截。
    client_max_body_size 55m;

    # SPA history 路由回退：所有未匹配路径交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
